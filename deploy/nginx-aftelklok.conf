# Aftelklok PWA — nginx server block
# De app draait via PM2 op poort 3020 (zie ecosystem.config.cjs).
# Kopieer naar bijv.:
#   /etc/nginx/sites-available/aftel-klok.clvs.nl
# Symlink: ln -s .../sites-available/aftel-klok.clvs.nl .../sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name aftel-klok.clvs.nl;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aftel-klok.clvs.nl;

    ssl_certificate     /etc/ssl/certs/aftel-klok.clvs.nl.crt;
    ssl_certificate_key /etc/ssl/private/aftel-klok.clvs.nl.key;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
