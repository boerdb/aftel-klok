# Aftelklok PWA — nginx server block
# Pas server_name en root aan jouw pad aan, kopieer naar bijv.:
#   /etc/nginx/sites-available/aftel-klok.clvs.nl
# Symlink: ln -s .../sites-available/aftel-klok.clvs.nl .../sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name aftel-klok.clvs.nl;

    # Redirect HTTP naar HTTPS (Cloudflare kan dit ook doen)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aftel-klok.clvs.nl;

    # Pas aan jouw certificaat-paden (Let's Encrypt / Cloudflare origin cert)
    ssl_certificate     /etc/ssl/certs/aftel-klok.clvs.nl.crt;
    ssl_certificate_key /etc/ssl/private/aftel-klok.clvs.nl.key;

    # Pad naar de inhoud van de Next.js static export (map out)
    root /var/www/aftelklok;
    index index.html;

    # PWA manifest — verkeerd MIME-type breekt installatie op Android/Windows
    types {
        application/manifest+json webmanifest;
    }

    # Service worker + manifest: altijd vers ophalen
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Gehashte JS/CSS: lang cachen (bestandsnaam wijzigt per build)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Overige statische bestanden
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Eén pagina: onbekende paden vallen terug op index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
